name: Build and Release msys2-bash (xdg patched)

on:
  push:
    branches: [ xdg-patched ]
    paths:
      - 'msys2-packages/ncurses/**'
      - 'msys2-packages/bash/**'
      - 'msys2-packages/msys2-runtime/**'
      - '.github/workflows/build-bash.yml'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel git make patch gcc autotools gettext-devel libiconv-devel zlib-devel

      - name: Build bash
        shell: msys2 {0}
        run: |
          cd bash
          gpg --recv-keys BB5869F064EA74AB
          makepkg --syncdeps --noconfirm

          FULL_PATH=$(ls bash-*.pkg.tar.zst | grep -vE "devel" | head -n 1)
          PKG_NAME=$(basename $FULL_PATH)

          # Export variables for the release step
          echo "BASH_PKG_NAME=$PKG_NAME" >> $GITHUB_ENV
          echo "BASH_PKG_PATH=bash/$PKG_NAME" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BASH_PKG_NAME }}
          name: ${{ env.BASH_PKG_NAME }}
          files: ${{ env.BASH_PKG_PATH }}

